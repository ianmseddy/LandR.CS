# Thin caller — shared logic lives in PredictiveEcology/actions (reusable workflow).
on:
  push:
    branches: [main, master, development]
  pull_request:
    branches: [main, master, development]

name: test-coverage

concurrency:
  # Group by ref so a PR run and a development-push run never cancel each other.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-coverage:
    if: "!contains(github.event.commits[0].message, '[skip-ci]')"
    uses: PredictiveEcology/actions/.github/workflows/test-coverage.yaml@v0.5
    with:
      extra-packages: |
        PredictiveEcology/LandR@development
